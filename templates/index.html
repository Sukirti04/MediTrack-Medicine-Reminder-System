<script>

// =====================================================
// IST CLOCK
// =====================================================

function getISTDate() {
    return new Date(
        new Date().toLocaleString("en-US", {
            timeZone: "Asia/Kolkata"
        })
    );
}


function updateClock() {

    const now = new Date();

    const time = now.toLocaleTimeString(
        "en-IN",
        {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false,
            timeZone: "Asia/Kolkata"
        }
    );

    document.getElementById("clock").innerText = time;
}


updateClock();

setInterval(updateClock, 1000);


// =====================================================
// BROWSER NOTIFICATIONS
// =====================================================

function enableNotifications() {

    if (!("Notification" in window)) {

        alert(
            "Browser notifications are not supported."
        );

        return;
    }

    Notification.requestPermission()
        .then(function(permission) {

            if (permission === "granted") {

                alert(
                    "✓ Notifications enabled!"
                );

            } else {

                alert(
                    "Please allow notifications from your browser settings."
                );

            }

        });

}


// =====================================================
// MEDICINE DATA FROM FLASK
// =====================================================

const medicines = [

    {% for medicine in medicines %}

    {
        id: {{ medicine["id"] }},
        name: {{ medicine["name"]|tojson }},
        dosage: {{ medicine["dosage"]|tojson }},
        time: {{ medicine["time"]|tojson }}
    }

    {% if not loop.last %},{% endif %}

    {% endfor %}

];


// =====================================================
// REMINDER STATE
// =====================================================

let lastReminderKey = "";


// =====================================================
// SHOW BROWSER NOTIFICATION
// =====================================================

function sendNotification(medicine) {

    if (
        "Notification" in window &&
        Notification.permission === "granted"
    ) {

        new Notification(
            "💊 Medicine Reminder",
            {
                body:
                    medicine.name +
                    " - " +
                    medicine.dosage
            }
        );

    }

}


// =====================================================
// VOICE REMINDER
// =====================================================

function speakReminder(medicine) {

    if ("speechSynthesis" in window) {

        window.speechSynthesis.cancel();

        const speech =
            new SpeechSynthesisUtterance(
                "Time to take " +
                medicine.name +
                ". Dosage: " +
                medicine.dosage
            );

        speech.rate = 0.9;

        window.speechSynthesis.speak(
            speech
        );

    }

}


// =====================================================
// SHOW REMINDER ON PAGE
// =====================================================

function showReminder(medicine) {

    const area =
        document.getElementById(
            "reminderArea"
        );

    area.innerHTML = `

        <div class="reminder">

            <h2>
                🔔 Medicine Reminder
            </h2>

            <div class="reminder-content">

                <div class="medicine-doodle">
                    💊
                </div>

                <div class="reminder-info">

                    <p>
                        <strong>Medicine:</strong>
                        ${escapeHTML(medicine.name)}
                    </p>

                    <p>
                        <strong>Dosage:</strong>
                        ${escapeHTML(medicine.dosage)}
                    </p>

                    <p>
                        <strong>Time:</strong>
                        ${escapeHTML(medicine.time)}
                    </p>

                </div>

                <button
                    class="take-btn"
                    onclick="takeMedicine(${medicine.id})">

                    ✓ Mark as Taken

                </button>

            </div>

        </div>

    `;

}


// =====================================================
// SAFETY FOR DISPLAYING TEXT
// =====================================================

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// =====================================================
// EXACT IST REMINDER CHECK
// =====================================================

function checkScheduledMedicines() {

    const now = getISTDate();

    const hours =
        String(now.getHours()).padStart(2, "0");

    const minutes =
        String(now.getMinutes()).padStart(2, "0");

    const currentTime =
        hours + ":" + minutes;

    const today =
        now.getFullYear() +
        "-" +
        String(now.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(now.getDate()).padStart(2, "0");


    medicines.forEach(function(medicine) {

        if (medicine.time === currentTime) {

            const reminderKey =
                today +
                "_" +
                medicine.id +
                "_" +
                medicine.time;


            if (reminderKey !== lastReminderKey) {

                lastReminderKey =
                    reminderKey;


                showReminder(medicine);

                sendNotification(medicine);

                speakReminder(medicine);

            }

        }

    });

}


// =====================================================
// CHECK EVERY SECOND
// =====================================================

checkScheduledMedicines();

setInterval(
    checkScheduledMedicines,
    1000
);


// =====================================================
// TEST REMINDER
// =====================================================

function testReminder() {

    fetch("/api/test")

        .then(response => {

            if (!response.ok) {
                throw new Error(
                    "Test reminder failed"
                );
            }

            return response.json();

        })

        .then(data => {

            showReminder({

                id: data.id,

                name: data.medicine,

                dosage: data.dosage,

                time: data.time

            });


            if (
                "Notification" in window &&
                Notification.permission === "granted"
            ) {

                new Notification(
                    "💊 Test Medicine Reminder",
                    {
                        body:
                            data.medicine +
                            " - " +
                            data.dosage
                    }
                );

            }


            if ("speechSynthesis" in window) {

                window.speechSynthesis.cancel();

                const speech =
                    new SpeechSynthesisUtterance(
                        "Test reminder. Time to take " +
                        data.medicine
                    );

                window.speechSynthesis.speak(
                    speech
                );

            }

        })

        .catch(function(error) {

            console.error(error);

            alert(
                "Unable to start test reminder."
            );

        });

}


// =====================================================
// MARK AS TAKEN
// =====================================================

function takeMedicine(id) {

    const button =
        document.querySelector(
            ".take-btn"
        );


    if (button) {

        button.disabled = true;

        button.innerText =
            "✓ Saving...";

    }


    fetch(
        "/api/take/" + id,
        {
            method: "POST",
            headers: {
                "Content-Type":
                    "application/json"
            }
        }
    )

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Server returned " +
                response.status
            );

        }

        return response.json();

    })

    .then(data => {

        if (data.success) {

            document.getElementById(
                "reminderArea"
            ).innerHTML = `

                <div class="reminder">

                    <h2>
                        ✅ Medicine Taken
                    </h2>

                    <p>
                        Great! Your medicine has been
                        marked as taken.
                    </p>

                </div>

            `;


            // Refresh page after a short delay
            setTimeout(
                function() {
                    window.location.reload();
                },
                800
            );


        } else {

            throw new Error(
                data.message ||
                "Could not mark medicine as taken."
            );

        }

    })

    .catch(function(error) {

        console.error(
            "Mark as Taken error:",
            error
        );


        if (button) {

            button.disabled = false;

            button.innerText =
                "✓ Mark as Taken";

        }


        alert(
            "Could not mark the medicine as taken. Please try again."
        );

    });

}

</script>
